<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge 3D Studio</title>
<style>
:root{--bg:#0d0e11;--panel:#16181d;--line:#272a32;--txt:#e9eaee;--dim:#8d93a1;--acc:#ff7a1a;--acc2:#ffb347}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;flex-direction:column;min-height:100%}
#view{position:relative;height:52vh;min-height:280px;background:radial-gradient(ellipse at 50% 35%,#2b2f3a 0%,#14161b 60%,#0b0c0f 100%)}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#title{font-weight:700;text-shadow:0 1px 4px #000}
#stats{font-size:12px;color:var(--dim);text-shadow:0 1px 3px #000}
#tools{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{background:#000b;border:1px solid #fff2;color:var(--txt);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{border-color:var(--acc);color:var(--acc2)}
#busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#0b0c0fcc;text-align:center;padding:20px}
#busy.show{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #fff2;border-top-color:var(--acc);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#panel{flex:1;background:var(--panel);border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
textarea,input[type=text]{width:100%;background:#0e1014;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:inherit;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--acc)}
#drop{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:10px;padding:10px;cursor:pointer;color:var(--dim)}
#drop.over{border-color:var(--acc);color:var(--txt)}
#thumb{width:54px;height:54px;border-radius:8px;object-fit:cover;display:none}
#clr{margin-left:auto;display:none}
.seg{display:flex;background:#0e1014;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:0;color:var(--dim);padding:9px 4px;font:inherit;cursor:pointer}
.seg button.on{background:#262a33;color:var(--txt)}
.btn{background:linear-gradient(180deg,var(--acc2),var(--acc));border:0;color:#1a0d00;font-weight:800;font-size:16px;border-radius:12px;padding:13px;cursor:pointer;width:100%}
.btn:disabled{filter:grayscale(1);opacity:.5}
.btn2{background:#262a33;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.row{display:flex;gap:8px}
#note{font-size:13px;color:var(--acc2);min-height:18px}
#lib{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;background:#0e1014;border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}
.item.sel{border-color:var(--acc)}
.item b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.del{background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer;padding:2px 6px}
.hide{display:none!important}
@media(min-width:860px){
 #app{flex-direction:row-reverse;height:100%}
 #view{flex:1;height:auto}
 #panel{flex:0 0 380px;border-top:0;border-right:1px solid var(--line);overflow:auto}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="hud"><div id="title">Forge 3D</div><div id="stats"></div></div>
    <div id="tools">
      <button class="chip on" id="bRot">Rotate</button>
      <button class="chip on" id="bQ">Quality: High</button>
      <button class="chip" id="bReset">Reset view</button>
      <button class="chip hide" id="bGlb">Download .glb</button>
      <button class="chip hide" id="bPng">Save image</button>
    </div>
    <div id="busy"><div class="spin"></div><div id="busyTxt">Forging…</div><button class="chip" id="bStop">Stop</button></div>
  </div>
  <div id="panel">
    <div>
      <h2>Describe your model</h2>
      <textarea id="prompt" rows="3" placeholder="e.g. a weathered medieval longsword with a leather-wrapped grip"></textarea>
    </div>
    <div>
      <h2>Reference image (optional)</h2>
      <label id="drop"><img id="thumb" alt=""><span id="dropTxt">Tap to add an image</span>
        <button class="btn2" id="clr" type="button">Remove</button>
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label>
    </div>
    <div>
      <h2>Detail</h2>
      <div class="seg" id="detail"><button data-d="draft">Draft</button><button data-d="std" class="on">Standard</button><button data-d="high">Ultra</button></div>
    </div>
    <button class="btn" id="go">Generate 3D model</button>
    <div id="refineBox" class="hide">
      <h2>Improve this model</h2>
      <div class="row"><input type="text" id="refine" placeholder="e.g. make the blade longer, add rust"><button class="btn2" id="bRefine">Apply</button></div>
      <div class="row" style="margin-top:8px"><button class="btn2" id="bEnh" style="flex:1">✨ Auto-enhance (Claude looks at the render and fixes it)</button></div>
    </div>
    <div id="note"></div>
    <div>
      <h2>Library</h2>
      <div id="lib"><div style="color:var(--dim);font-size:13px" id="libEmpty">Models you or Claude generate appear here.</div></div>
    </div>
  </div>
</div>

const RULES = `You are a senior game-studio 3D prop/character modeler. Build the requested object as a JSON model spec that a procedural renderer turns into a realistic PBR 3D model. Think like a modeler: silhouette first, then secondary forms, then small details.

{"name":"Short name","materials":{"<id>":{...}},"parts":[...]}

COORDINATES: metres, Y up, model stands on y=0, centred on x=0,z=0, front faces +Z. Rotations "r" are degrees [x,y,z]. Use true real-world proportions.

MATERIAL fields: "preset" (metal|chrome|gold|iron|plastic|rubber|glass|paint|wood|fabric|leather|stone|ceramic|skin|emissive), optional "color":"#rrggbb", "rough":0-1, "metal":0-1, "clearcoat":0-1, "glow":0-10, "opacity":0-1, "tex":(none|noise|scratched|brushed|wood|fabric|leather|stone), "texScale":number. Define 4-10 materials; vary colour/roughness between neighbouring parts; real objects are never one flat colour. Slightly desaturated, believable colours.
