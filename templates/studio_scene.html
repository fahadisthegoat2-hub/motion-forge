<!-- Motion Video studio template — clean semi-real CG look. Three.js only (no Blender/Python).
     Edit ONLY the "DIRECTION" block (CONFIG, CAST, SHOTS, CAPTIONS). Everything is a pure function of time t,
     so previews, cloud renders and on-device renders are frame-identical.
     Render: node scripts/render_video.js this.html out.mp4 --quality good|high|epic   (or the on-page panel) -->

<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b78d0}canvas{display:block;width:100%;height:100%;object-fit:contain}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ================================ DIRECTION ================================ */
const LIB = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/models/gltf/';

const CONFIG = {
  width: 1080, height: 1920, fps: 30,          // long-form: width 1920, height 1080
  bgTop: '#0b78d0', bgBottom: '#6fd6fb',       // studio cyclorama gradient
  grain: 0.035, vignette: 0.28,
  // Clip libraries (Mixamo-style rigs). Any clip auto-retargets onto any humanoid in CAST.
  // Add your own Mixamo FBX files here, e.g. 'animations/Waving.fbx' → clip name 'waving'.
  animations: [LIB + 'Xbot.glb', LIB + 'Soldier.glb'],
};

// Characters: first URL that loads wins. Best: your own models in the repo's characters/ folder
// (Avaturn GLB = face + blink/expressions; Mixamo FBX = body). Fallback: sample semi-real man.
const CAST = {
  hero: {
    urls: ['characters/hero.glb', 'characters/hero.fbx', LIB + 'readyplayer.me.glb'],
    height: 1.80,                                 // metres; model is auto-scaled to this
    wardrobe: { top: '#b6f22e', bottom: null, shoes: null },   // solid colors (null = keep original)
  },
};

// Shots play back-to-back. Inside a shot every key list is [[time, value, ease?], ...] in shot-local seconds.
// Clips: idle, walk, run, agree, headshake, sad_pose, sneak_pose (+ any you add). 'camera' = look at the lens.
// Faces: smile, shock, worried, sad, angry (0..1). talk: [[start,end],...] mouth flaps while speaking.
const SHOTS = [
  {
    name: 'Hook', dur: 3.0, chapter: null, fadeIn: 0.25,
    camera: { pos: [[0, [0.25, 1.62, 2.6]], [3, [0.05, 1.6, 1.85], 'inOutSine']], look: [[0, [0, 1.55, 0]]], fov: 30, handheld: 1 },
    cast: {
      hero: {
        pos: [[0, [0, 0, 0]]], rotY: [[0, 0]],
        clips: [{ clip: 'idle', start: 0, end: 3 }],
        look: [[0, [0.8, 1.5, 1]], [0.9, 'camera', 'outCubic']],
        face: { worried: [[0, 0], [1.2, 0.7, 'outCubic']] },
        talk: [[1.0, 2.7]],
      },
    },
  },
  {
    name: 'Reaction', dur: 3.0,
    camera: { pos: [[0, [-1.4, 1.35, 3.4]], [3, [-1.0, 1.4, 3.0], 'inOutSine']], look: [[0, [0, 1.15, 0]]], fov: 34, handheld: 1,
      shakes: [{ t: 1.25, amp: 1.0, decay: 0.35 }] },
    cast: {
      hero: {
        clips: [{ clip: 'idle', start: 0, end: 1.2 }, { clip: 'headshake', start: 1.1, end: 3, fade: 0.25 }],
        look: [[0, 'camera']],
        face: { shock: [[1.15, 0], [1.35, 1, 'outBack'], [2.6, 0.4]] },
      },
    },
  },
];

// Word-by-word captions (drawn into the video). hi = words to highlight.
const CAPTIONS = [
  { t: 0.15, text: 'WHAT HAPPENS IF', hi: ['HAPPENS'] },
  { t: 1.6, text: 'YOU NEVER SLEEP?', hi: ['NEVER'] },
  { t: 4.2, text: 'DAY 3…', hi: ['3…'] },
];
/* ============================== END DIRECTION ============================== */

/* ---------- math helpers (deterministic) ---------- */
const EASE = {
  linear: (x) => x, inSine: (x) => 1 - Math.cos(x * Math.PI / 2), outSine: (x) => Math.sin(x * Math.PI / 2),
  inOutSine: (x) => -(Math.cos(Math.PI * x) - 1) / 2, inCubic: (x) => x ** 3, outCubic: (x) => 1 - (1 - x) ** 3,
  inOutCubic: (x) => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2, outExpo: (x) => x === 1 ? 1 : 1 - 2 ** (-10 * x),

  outBack: (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2,
  outElastic: (x) => x === 0 ? 0 : x === 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1,

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const noise = (x, seed = 0) => { const i = Math.floor(x), f = x - i; return (hash(i + seed * 57) * (1 - smooth(f)) + hash(i + 1 + seed * 57) * smooth(f)) * 2 - 1; };

const lerpV = (a, b, e) => Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * e) : a + (b - a) * e;
// key([[t,v,ease],...], t, resolve) → value at t
function key(keys, t, resolve = (v) => v) {
  if (keys === undefined || keys === null) return undefined;
  if (!Array.isArray(keys) || !Array.isArray(keys[0])) return resolve(keys);
  if (t <= keys[0][0]) return resolve(keys[0][1]);
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, v0] = keys[i], [t1, v1, e] = keys[i + 1];
    if (t < t1) return lerpV(resolve(v0), resolve(v1), (EASE[e] || EASE.inOutCubic)((t - t0) / (t1 - t0)));
  }
  return resolve(keys[keys.length - 1][1]);
}
const TOTAL = SHOTS.reduce((s, x) => s + x.dur, 0);
function shotAt(t) {
  let acc = 0;
  for (let i = 0; i < SHOTS.length; i++) { if (t < acc + SHOTS[i].dur || i === SHOTS.length - 1) return { shot: SHOTS[i], i, local: t - acc, start: acc }; acc += SHOTS[i].dur; }
}
const CHAPTERS = (() => { const out = []; let acc = 0; for (const s of SHOTS) { if (s.chapter) out.push({ name: s.chapter, start: acc }); acc += s.dur; }
  return out.length ? out.map((c, i) => ({ ...c, end: out[i + 1] ? out[i + 1].start : TOTAL })) : null; })();

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const bg = new THREE.Mesh(new THREE.SphereGeometry(40, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { top: { value: new THREE.Color(CONFIG.bgTop) }, bot: { value: new THREE.Color(CONFIG.bgBottom) } },
  vertexShader: 'varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top, bot; varying vec3 p; void main(){ float h = smoothstep(-2., 16., p.y); gl_FragColor = vec4(mix(bot, top, h), 1.); }',
}));
scene.add(bg);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.25, color: '#0a3a66' }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const key1 = new THREE.DirectionalLight('#fff1e2', 3.3); key1.position.set(2.6, 3.8, 2.9);
key1.castShadow = true; key1.shadow.mapSize.set(2048, 2048); key1.shadow.bias = -0.0004; key1.shadow.normalBias = 0.02;
Object.assign(key1.shadow.camera, { left: -2.5, right: 2.5, top: 3, bottom: -1, near: 0.5, far: 15 });
const fill = new THREE.HemisphereLight('#d6ecff', '#6b7f8c', 0.55);
const rim = new THREE.DirectionalLight('#bfe2ff', 2.4); rim.position.set(-2.6, 3.2, -3);
const rim2 = new THREE.DirectionalLight('#ffe2c8', 0.9); rim2.position.set(2.8, 2.2, -2.5);
scene.add(key1, fill, rim, rim2);

const camera = new THREE.PerspectiveCamera(32, CONFIG.width / CONFIG.height, 0.05, 100);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 3, aperture: 0.0012, maxblur: 0.005 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uGrain: { value: CONFIG.grain }, uVig: { value: CONFIG.vignette }, uFade: { value: 0 }, uFlash: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uGrain, uVig, uFade, uFlash; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + uTime*61.7) * 43758.5453); }
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - .5;
      c.rgb *= 1. - uVig * smoothstep(.25, .85, length(d * vec2(1., 1.2)));
      c.rgb += (h(vUv * 1000.) - .5) * uGrain;
      c.rgb = mix(c.rgb, vec3(1.), uFlash); c.rgb *= 1. - uFade; gl_FragColor = c; }`,
});
composer.addPass(grade);

/* ---------- captions HUD ---------- */
const capCanvas = document.createElement('canvas'), capCtx = capCanvas.getContext('2d');
const capTex = new THREE.CanvasTexture(capCanvas); capTex.colorSpace = THREE.SRGBColorSpace;
const hud = new THREE.Scene(), hudCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
hud.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: capTex, transparent: true, toneMapped: false, depthTest: false })));
function drawCaptions(t, w, h) {
  if (capCanvas.width !== w || capCanvas.height !== h) { capCanvas.width = w; capCanvas.height = h; capTex.dispose(); }   // GPU storage is immutable → re-allocate
  capCtx.clearRect(0, 0, w, h);
  const idx = CAPTIONS.findLastIndex((c) => t >= c.t);
  if (idx >= 0) {
    const c = CAPTIONS[idx], end = c.t1 ?? (CAPTIONS[idx + 1]?.t ?? TOTAL);
    if (t < end) {
      const words = c.text.split(' '), size = Math.round(Math.min(w, h) * 0.085), gap = 0.16;
      capCtx.font = `900 ${size}px Inter, "Arial Black", "Helvetica Neue", Arial, sans-serif`;
      capCtx.textBaseline = 'middle'; capCtx.lineJoin = 'round';
      const space = size * 0.28, widths = words.map((x) => capCtx.measureText(x).width);
      // wrap into lines that fit 86% width
      const lines = [[]]; let lw = 0;
      words.forEach((wd, i) => { if (lw + widths[i] > w * 0.86 && lines.at(-1).length) { lines.push([]); lw = 0; } lines.at(-1).push(i); lw += widths[i] + space; });
      const y0 = h * (h > w ? 0.68 : 0.82) - (lines.length - 1) * size * 0.6;
      const outA = clamp((end - t) / 0.12);
      lines.forEach((ln, li) => {
        const total = ln.reduce((s, i) => s + widths[i], 0) + space * (ln.length - 1); let x = (w - total) / 2;
        ln.forEach((i) => {
          const p = clamp((t - c.t - i * gap) / 0.14); if (p <= 0) { x += widths[i] + space; return; }
          const s = (0.6 + 0.4 * EASE.outBack(p)) * (0.9 + 0.1 * outA), cx = x + widths[i] / 2, cy = y0 + li * size * 1.2;
          capCtx.save(); capCtx.globalAlpha = Math.min(p * 2, 1) * outA; capCtx.translate(cx, cy); capCtx.scale(s, s);
          capCtx.lineWidth = size * 0.16; capCtx.strokeStyle = 'rgba(0,0,0,.85)'; capCtx.strokeText(words[i], -widths[i] / 2, 0);
          capCtx.fillStyle = (c.hi || []).includes(words[i]) ? '#ffe14d' : '#ffffff'; capCtx.fillText(words[i], -widths[i] / 2, 0);
          capCtx.restore(); x += widths[i] + space;
        });
      });
    }
  }
  capTex.needsUpdate = true;
}

/* ---------- loading ---------- */
const gltfLoader = new GLTFLoader(), fbxLoader = new FBXLoader();
const loadAny = (url) => (/\.fbx$/i.test(url) ? fbxLoader : gltfLoader).loadAsync(url).then((r) => ({ scene: r.scene || r, animations: r.animations || [] }));
async function loadFirst(urls) { for (const u of urls) { try { return { ...(await loadAny(u)), url: u }; } catch {} } return null; }
const normName = (n) => n.replace(/^mixamorig\d*[:_]?/i, '').replace(/^.*[:|]/, '').replace(/[^a-z0-9]/gi, '').toLowerCase();

/* ---------- retargeting: world-space rotation transfer with rest-direction calibration ---------- */
function boneMap(root) { const m = {}; root.traverse((o) => { if (o.isBone && !m[normName(o.name)]) m[normName(o.name)] = o; }); return m; }
function restData(root, map) {
  root.updateMatrixWorld(true); const d = {};
  for (const [k, b] of Object.entries(map)) d[k] = { q: b.getWorldQuaternion(new THREE.Quaternion()), p: b.getWorldPosition(new THREE.Vector3()), local: b.quaternion.clone(), lp: b.position.clone() };
  return d;
}
const CHILD_HINT = { hips: 'spine', spine: 'spine1', spine1: 'spine2', spine2: 'neck', neck: 'head', leftshoulder: 'leftarm', leftarm: 'leftforearm', leftforearm: 'lefthand',
  rightshoulder: 'rightarm', rightarm: 'rightforearm', rightforearm: 'righthand', leftupleg: 'leftleg', leftleg: 'leftfoot', leftfoot: 'lefttoebase', rightupleg: 'rightleg', rightleg: 'rightfoot', rightfoot: 'righttoebase',
  lefthand: 'lefthandmiddle1', righthand: 'righthandmiddle1' };
function retargetClip(src, clip, tgt) {
  const sMap = boneMap(src.root), tMap = boneMap(tgt.root);
  const pairs = Object.keys(tMap).filter((k) => sMap[k] && !/eye|end$/.test(k));
  const C = {};
  for (const k of pairs) {   // calibrate rest-pose differences (T-pose vs A-pose) using bone directions
    const ck = CHILD_HINT[k]; C[k] = new THREE.Quaternion();
    if (ck && src.rest[ck] && tgt.rest[ck] && src.rest[k] && k !== 'hips') {
      const dS = src.rest[ck].p.clone().sub(src.rest[k].p).normalize(), dT = tgt.rest[ck].p.clone().sub(tgt.rest[k].p).normalize();
      if (dS.lengthSq() > 0 && dT.lengthSq() > 0) C[k].setFromUnitVectors(dT, dS);
    }
  }
  const mixer = new THREE.AnimationMixer(src.root), action = mixer.clipAction(clip); action.play();
  const fps = 30, n = Math.max(2, Math.round(clip.duration * fps) + 1), times = new Float32Array(n);
  const order = []; tgt.root.traverse((o) => { if (o.isBone) order.push(o); });
  const qv = {}; pairs.forEach((k) => (qv[k] = new Float32Array(n * 4)));
  const hipsPos = new Float32Array(n * 3);
  const hS = src.rest.hips, hT = tgt.rest.hips, scale = hT && hS ? hT.p.y / Math.max(hS.p.y, 1e-6) : 1;
  const newW = new Map(), tmpQ = new THREE.Quaternion(), tmpP = new THREE.Quaternion(), prev = {};
  let gAcc = 0, gTime = 0, prevFoot = null;   // ground speed from the planted foot (works for in-place and root-motion clips)
  for (let f = 0; f < n; f++) {
    const t = Math.min(f / fps, clip.duration); times[f] = t; mixer.setTime(t); src.root.updateMatrixWorld(true); newW.clear();
    for (const b of order) {
      const k = normName(b.name), parentW = b.parent && newW.has(b.parent) ? newW.get(b.parent) : b.parent ? b.parent.getWorldQuaternion(new THREE.Quaternion()) : new THREE.Quaternion();
      let world;
      if (qv[k]) {
        const delta = sMap[k].getWorldQuaternion(tmpQ).multiply(tmpP.copy(src.rest[k].q).invert());
        world = delta.clone().multiply(C[k]).multiply(tgt.rest[k].q);
        const local = parentW.clone().invert().multiply(world);
        if (prev[k] && prev[k].dot(local) < 0) local.set(-local.x, -local.y, -local.z, -local.w);
        prev[k] = local.clone(); local.toArray(qv[k], f * 4);
      } else world = parentW.clone().multiply(tgt.rest[k] ? tgt.rest[k].local : b.quaternion);
      newW.set(b, world);
    }
    if (sMap.hips && sMap.leftfoot && sMap.rightfoot) {
      const hp = sMap.hips.getWorldPosition(new THREE.Vector3()), lf = sMap.leftfoot.getWorldPosition(new THREE.Vector3()), rf = sMap.rightfoot.getWorldPosition(new THREE.Vector3());
      const low = lf.y < rf.y ? 'l' : 'r', rel = (low === 'l' ? lf : rf).sub(hp).multiplyScalar(scale);
      if (prevFoot && prevFoot.side === low) { gAcc += Math.hypot(rel.x - prevFoot.rel.x, rel.z - prevFoot.rel.z); gTime += 1 / fps; }
      prevFoot = { side: low, rel };
    }
    if (sMap.hips && tMap.hips) {
      const d = sMap.hips.getWorldPosition(new THREE.Vector3()).sub(hS.p).multiplyScalar(scale);
      d.x = 0; d.z = 0;   // in-place: characters are positioned by the shot, not the clip
      const wp = hT.p.clone().add(d), lp = tMap.hips.parent ? tMap.hips.parent.worldToLocal(wp) : wp; lp.toArray(hipsPos, f * 3);

  if (tMap.hips) tracks.push(new THREE.VectorKeyframeTrack(`${tMap.hips.name}.position`, times, hipsPos));
  const out = new THREE.AnimationClip(clip.name, clip.duration, tracks);
  out.rootSpeed = gTime > 0.2 ? gAcc / gTime : 0;   // natural ground speed in m/s (0 for idles/poses)
  return out;
}

/* ---------- materials ---------- */
const COPY = ['map', 'normalMap', 'normalScale', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap', 'emissive', 'color', 'transparent', 'alphaTest', 'opacity', 'side', 'alphaMap'];
function upgradeMaterials(root, wardrobe) {
  root.traverse((o) => {
    if (!o.isMesh) return; o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const out = mats.map((m) => {
      const n = ((m.name || '') + ' ' + o.name).toLowerCase(), p = new THREE.MeshPhysicalMaterial();
      COPY.forEach((k) => { if (m[k] !== undefined && m[k] !== null) p[k] = m[k].clone ? m[k].clone() : m[k]; });
      p.metalness = 0; p.roughness = m.roughness ?? 0.6; p.name = m.name;
      if (/eye/.test(n)) Object.assign(p, { roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.03 });
      else if (/teeth|tooth/.test(n)) Object.assign(p, { roughness: 0.35, clearcoat: 0.4 });
      else if (/skin|body|head|face|arm|leg/.test(n) && !/outfit|top|bottom|shoe|foot|wear/.test(n))
        { p.color.multiply(new THREE.Color('#ffe2d2')); Object.assign(p, { roughness: p.roughnessMap ? 0.9 : 0.5, sheen: 0.35, sheenRoughness: 0.55, sheenColor: new THREE.Color('#ff9e86'), clearcoat: 0.06, clearcoatRoughness: 0.45 }); }
      else if (/hair|beard|brow|lash/.test(n)) Object.assign(p, { roughness: 0.62, sheen: 0.4, sheenColor: new THREE.Color('#ffffff') });
      else Object.assign(p, { roughness: Math.max(p.roughness, 0.7), sheen: 0.5, sheenRoughness: 0.8, sheenColor: new THREE.Color('#ffffff') });
      const slot = /top|shirt|torso|jacket/.test(n) ? 'top' : /bottom|pant|trouser|jean|short/.test(n) ? 'bottom' : /foot|shoe|sneaker|boot/.test(n) ? 'shoes' : null;
      if (slot && wardrobe && wardrobe[slot]) { p.map = null; p.color = new THREE.Color(wardrobe[slot]); }   // plain solid clothing
      if (p.map) p.map.colorSpace = THREE.SRGBColorSpace;
      return p;
    });
    o.material = Array.isArray(o.material) ? out : out[0];
  });
}

/* ---------- characters ---------- */
const FACE = {   // expression → morph weights (ARKit names + Ready-Player-Me fallbacks)
  smile: { mouthSmile: 1, mouthSmile_L: 1, mouthSmile_R: 1, mouthSmileLeft: 1, mouthSmileRight: 1, cheekSquint_L: .4, cheekSquint_R: .4 },
  shock: { jawOpen: .55, mouthOpen: .7, eyeWide_L: 1, eyeWide_R: 1, eyeWideLeft: 1, eyeWideRight: 1, browInnerUp: 1, browOuterUp_L: .8, browOuterUp_R: .8 },
  worried: { browInnerUp: .9, mouthFrown_L: .5, mouthFrown_R: .5, mouthFrownLeft: .5, mouthFrownRight: .5, mouthStretch_L: .3, mouthStretch_R: .3 },
  sad: { browInnerUp: .8, mouthFrown_L: .8, mouthFrown_R: .8, mouthFrownLeft: .8, mouthFrownRight: .8, eyeSquint_L: .2, eyeSquint_R: .2 },
  angry: { browDown_L: 1, browDown_R: 1, browDownLeft: 1, browDownRight: 1, noseSneer_L: .6, noseSneer_R: .6, mouthPress_L: .5, mouthPress_R: .5 },
};
const BLINK = ['eyeBlink_L', 'eyeBlink_R', 'eyeBlinkLeft', 'eyeBlinkRight', 'eyesClosed', 'blink'];
const TALK = ['jawOpen', 'mouthOpen', 'viseme_aa'];
const characters = {};
const clipLib = {};
const sources = [];

<!-- motion-forge DEVICE RENDER PANEL — paste before </body> of any scene exposing window.__mf.
     Renders frame-perfect on the viewer's own GPU (WebCodecs) and downloads MP4s. No server, no Python.
     Long-form: set __mf.chapters = [{name, start, end}] → each chapter renders to its own file (iPad-safe memory). -->
<div id="mf-panel" style="position:fixed;right:12px;bottom:12px;z-index:9999;font:13px/1.4 system-ui,sans-serif;color:#fff;background:rgba(10,20,35,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:12px;padding:12px 14px;width:min(300px,calc(100vw - 48px));box-shadow:0 8px 30px rgba(0,0,0,.35)">
  <b style="font-size:14px">Render on this device</b>
  <div id="mf-specs" style="opacity:.8;margin:6px 0 8px;font-size:12px"></div>
  <label>Quality <select id="mf-q" style="width:100%;margin:4px 0 8px;padding:4px;border-radius:6px"></select></label>
  <label id="mf-chl" style="display:none">Part <select id="mf-ch" style="width:100%;margin:4px 0 8px;padding:4px;border-radius:6px"></select></label>
  <button id="mf-go" style="width:100%;padding:8px;border:0;border-radius:8px;background:#22d3ee;color:#04202a;font-weight:700;cursor:pointer">Render MP4</button>
  <div id="mf-bar" style="height:6px;background:#ffffff22;border-radius:3px;margin-top:8px;overflow:hidden"><div style="height:100%;width:0;background:#22d3ee"></div></div>

<script type="module">

const msg = (t) => ($('mf-msg').textContent = t);

let gpu = 'unknown GPU';

const tier = (!weakGpu && (apple || (cores >= 8 && mem >= 8))) ? 2 : (cores >= 4 && mem >= 4) ? 1 : 0;
$('mf-specs').textContent = `${cores} cores · ${mem}GB+ RAM · ${gpu.replace(/ANGLE \(|\)$/g, '').slice(0, 60)}`;
