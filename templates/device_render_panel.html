<!-- motion-forge DEVICE RENDER PANEL — paste before </body> of any scene exposing window.__mf.
     Renders frame-perfect on the viewer's own GPU (WebCodecs) and downloads an MP4. No server, no Python. -->
<div id="mf-panel" style="position:fixed;right:12px;bottom:12px;z-index:9999;font:13px/1.4 system-ui,sans-serif;color:#fff;background:rgba(10,20,35,.88);backdrop-filter:blur(8px);border-radius:12px;padding:12px 14px;width:min(300px,calc(100vw - 48px));box-shadow:0 8px 30px rgba(0,0,0,.35)">
  <b style="font-size:14px">Render on this device</b>
  <div id="mf-specs" style="opacity:.8;margin:6px 0 8px;font-size:12px"></div>
  <label>Quality <select id="mf-q" style="width:100%;margin:4px 0 8px;padding:4px;border-radius:6px"></select></label>
  <button id="mf-go" style="width:100%;padding:8px;border:0;border-radius:8px;background:#22d3ee;color:#04202a;font-weight:700;cursor:pointer">Render MP4</button>
  <div id="mf-bar" style="height:6px;background:#ffffff22;border-radius:3px;margin-top:8px;overflow:hidden"><div style="height:100%;width:0;background:#22d3ee"></div></div>
  <div id="mf-msg" style="font-size:12px;margin-top:6px;opacity:.85"></div>
</div>
<script type="module">
const $ = (id) => document.getElementById(id);
// --- Read device specs ---
const cores = navigator.hardwareConcurrency || 4, mem = navigator.deviceMemory || 4;
let gpu = 'unknown GPU';
try { const gl = document.createElement('canvas').getContext('webgl'); const ext = gl.getExtension('WEBGL_debug_renderer_info');
  gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); } catch {}
const weakGpu = /intel|mali|adreno [1-5]|powervr|swiftshader|llvmpipe/i.test(gpu);
const tier = (cores >= 8 && mem >= 8 && !weakGpu) ? 2 : (cores >= 4 && mem >= 4) ? 1 : 0;
$('mf-specs').textContent = `${cores} cores · ${mem}GB+ RAM · ${gpu.replace(/ANGLE \(|\)$/g, '').slice(0, 60)}`;
const base = window.__mf || {}, W = base.width || 1080, H = base.height || 1920, F = base.fps || 30;
const presets = [
  { label: `Good — ${W}×${H} @ 30fps`, s: 1, fps: 30, br: 12e6 },
  { label: `High — ${W}×${H} @ 60fps`, s: 1, fps: 60, br: 20e6 },
  { label: `Epic — ${Math.round(W * 4 / 3)}×${Math.round(H * 4 / 3)} @ 60fps`, s: 4 / 3, fps: 60, br: 40e6 },
];
$('mf-q').add(new Option('Choose quality…', ''));
presets.forEach((p, i) => $('mf-q').add(new Option(p.label + (i === tier ? '  ★ best for your device' : ''), i)));
$('mf-q').value = '';

$('mf-go').onclick = async () => {
  const mf = window.__mf; if (!mf) return ($('mf-msg').textContent = 'Scene not ready yet.');
  if ($('mf-q').value === '') return ($('mf-msg').textContent = 'Pick Good, High or Epic first.');
  if (+$('mf-q').value > tier) $('mf-msg').textContent = 'Above your device tier — will be slower, quality is the same.';
  if (!('VideoEncoder' in window)) return ($('mf-msg').textContent = 'This browser lacks WebCodecs — use Chrome, Edge or Safari 17+.');
  const p = presets[$('mf-q').value], w = Math.round(W * p.s / 2) * 2, h = Math.round(H * p.s / 2) * 2;
  const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm');
  // pick best supported codec: H.264 (universal upload) → VP9 fallback
  const cands = [{ c: 'avc1.640033', m: 'avc' }, { c: 'avc1.4d0033', m: 'avc' }, { c: 'vp09.00.40.08', m: 'vp9' }];
  let pick;
  for (const k of cands) {
    for (const hw of ['prefer-hardware', 'no-preference']) {
      const cfg = { codec: k.c, width: w, height: h, bitrate: p.br, framerate: p.fps, hardwareAcceleration: hw };
      if ((await VideoEncoder.isConfigSupported(cfg)).supported) { pick = { ...k, cfg }; break; }
    }
    if (pick) break;
  }
  if (!pick) return ($('mf-msg').textContent = 'No supported video encoder for this size.');
  const target = new ArrayBufferTarget();
  const muxer = new Muxer({ target, video: { codec: pick.m, width: w, height: h, frameRate: p.fps }, fastStart: 'in-memory' });
  const enc = new VideoEncoder({ output: (ch, meta) => muxer.addVideoChunk(ch, meta), error: (e) => ($('mf-msg').textContent = e.message) });
  enc.configure(pick.cfg);

  window.__mfManual = true; $('mf-go').disabled = true; $('mf-panel').style.opacity = .35;
  const canvas = mf.canvas || document.querySelector('canvas');
  mf.setSize ? mf.setSize(w, h) : (canvas.width = w, canvas.height = h);
  const total = Math.round(mf.duration * p.fps), t0 = performance.now();
  for (let f = 0; f < total; f++) {
    await mf.render(f / p.fps);
    const frame = new VideoFrame(canvas, { timestamp: Math.round(f * 1e6 / p.fps), duration: Math.round(1e6 / p.fps) });
    enc.encode(frame, { keyFrame: f % (p.fps * 2) === 0 }); frame.close();
    while (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 1));
    if (f % 5 === 0) {
      const pct = (f + 1) / total, eta = (performance.now() - t0) / pct * (1 - pct) / 1000;
      $('mf-bar').firstElementChild.style.width = (pct * 100).toFixed(1) + '%';
      $('mf-msg').textContent = `Frame ${f + 1}/${total} · ~${Math.ceil(eta)}s left · ${pick.m.toUpperCase()}`;
      await new Promise((r) => requestAnimationFrame(r));
    }
  }
  await enc.flush(); muxer.finalize();
  const url = URL.createObjectURL(new Blob([target.buffer], { type: 'video/mp4' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: (document.title || 'render').replace(/\W+/g, '-') + '.mp4' });
  document.body.appendChild(a); a.click();
  $('mf-bar').firstElementChild.style.width = '100%';
  $('mf-msg').textContent = `Done in ${((performance.now() - t0) / 1000).toFixed(1)}s — MP4 downloaded.`;
  window.__mfManual = false; $('mf-go').disabled = false; $('mf-panel').style.opacity = 1;
  dispatchEvent(new Event('resize'));
};
</script>
