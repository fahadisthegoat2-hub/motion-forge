<!-- motion-forge DEVICE RENDER PANEL — paste before </body> of any scene exposing window.__mf.
     Renders frame-perfect on the viewer's own GPU (WebCodecs) and downloads MP4s. No server, no Python.
     Long-form: set __mf.chapters = [{name, start, end}] → each chapter renders to its own file (iPad-safe memory). -->
<div id="mf-panel" style="position:fixed;right:12px;bottom:12px;z-index:9999;font:13px/1.4 system-ui,sans-serif;color:#fff;background:rgba(10,20,35,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:12px;padding:12px 14px;width:min(300px,calc(100vw - 48px));box-shadow:0 8px 30px rgba(0,0,0,.35)">
  <b style="font-size:14px">Render on this device</b>
  <div id="mf-specs" style="opacity:.8;margin:6px 0 8px;font-size:12px"></div>
  <label>Quality <select id="mf-q" style="width:100%;margin:4px 0 8px;padding:4px;border-radius:6px"></select></label>
  <label id="mf-chl" style="display:none">Part <select id="mf-ch" style="width:100%;margin:4px 0 8px;padding:4px;border-radius:6px"></select></label>
  <button id="mf-go" style="width:100%;padding:8px;border:0;border-radius:8px;background:#22d3ee;color:#04202a;font-weight:700;cursor:pointer">Render MP4</button>
  <div id="mf-bar" style="height:6px;background:#ffffff22;border-radius:3px;margin-top:8px;overflow:hidden"><div style="height:100%;width:0;background:#22d3ee"></div></div>
  <div id="mf-msg" style="font-size:12px;margin-top:6px;opacity:.85"></div>
</div>
<script type="module">
const $ = (id) => document.getElementById(id);
const msg = (t) => ($('mf-msg').textContent = t);
// --- Read device specs ---
const cores = navigator.hardwareConcurrency || 4, mem = navigator.deviceMemory || 4;
let gpu = 'unknown GPU';
try { const gl = document.createElement('canvas').getContext('webgl'); const ext = gl.getExtension('WEBGL_debug_renderer_info');
  gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); } catch {}
const apple = /apple/i.test(gpu) || /iPad|iPhone|Macintosh/.test(navigator.userAgent);
const weakGpu = /intel|mali|adreno [1-5]|powervr|swiftshader|llvmpipe/i.test(gpu);
const tier = (!weakGpu && (apple || (cores >= 8 && mem >= 8))) ? 2 : (cores >= 4 && mem >= 4) ? 1 : 0;
$('mf-specs').textContent = `${cores} cores · ${mem}GB+ RAM · ${gpu.replace(/ANGLE \(|\)$/g, '').slice(0, 60)}`;

const base = window.__mf || {}, W = base.width || 1080, H = base.height || 1920;
const presets = [
  { name: 'Good', s: 1, fps: 30 },
  { name: 'High', s: 1, fps: 60 },
  { name: 'Epic', s: 4 / 3, fps: 60 },
];
const dims = (p) => [Math.round(W * p.s / 2) * 2, Math.round(H * p.s / 2) * 2];
$('mf-q').add(new Option('Choose quality…', ''));
presets.forEach((p, i) => { const [w, h] = dims(p); $('mf-q').add(new Option(`${p.name} — ${w}×${h} @ ${p.fps}fps` + (i === tier ? '  ★ best for your device' : ''), i)); });
$('mf-q').value = '';

// Parts (chapters) for long-form
const chapters = Array.isArray(base.chapters) && base.chapters.length ? base.chapters : null;
if (chapters) {
  $('mf-chl').style.display = '';
  $('mf-ch').add(new Option(`All ${chapters.length} parts (one file each)`, 'all'));
  chapters.forEach((c, i) => $('mf-ch').add(new Option(`Part ${i + 1}: ${c.name} (${Math.floor((c.end - c.start) / 60)}:${String(Math.round((c.end - c.start) % 60)).padStart(2, '0')})`, i)));
}

let encoderPick;
async function pickEncoder(w, h, fps, br) {
  const cands = [{ c: 'avc1.640033', m: 'avc' }, { c: 'avc1.4d0033', m: 'avc' }, { c: 'vp09.00.50.08', m: 'vp9' }];
  for (const k of cands) for (const hw of ['prefer-hardware', 'no-preference']) {
    const cfg = { codec: k.c, width: w, height: h, bitrate: br, framerate: fps, hardwareAcceleration: hw };
    try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) return { ...k, cfg }; } catch {}
  }
}

async function renderRange(mf, canvas, start, end, label, p, w, h, Muxer, ArrayBufferTarget) {
  const target = new ArrayBufferTarget();
  const muxer = new Muxer({ target, video: { codec: encoderPick.m, width: w, height: h, frameRate: p.fps }, fastStart: 'in-memory' });
  let failed;
  const enc = new VideoEncoder({ output: (ch, meta) => muxer.addVideoChunk(ch, meta), error: (e) => (failed = e) });
  enc.configure(encoderPick.cfg);
  const total = Math.round((end - start) * p.fps), t0 = performance.now();
  for (let f = 0; f < total; f++) {
    if (failed) throw failed;
    await mf.render(start + f / p.fps);
    const frame = new VideoFrame(canvas, { timestamp: Math.round(f * 1e6 / p.fps), duration: Math.round(1e6 / p.fps) });
    enc.encode(frame, { keyFrame: f % (p.fps * 2) === 0 }); frame.close();
    while (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 1));
    if (f % 5 === 0) {
      const pct = (f + 1) / total, eta = (performance.now() - t0) / pct * (1 - pct) / 1000;
      $('mf-bar').firstElementChild.style.width = (pct * 100).toFixed(1) + '%';
      msg(`${label} · frame ${f + 1}/${total} · ~${Math.ceil(eta)}s left`);
      await new Promise((r) => requestAnimationFrame(r));
    }
  }
  await enc.flush(); enc.close(); muxer.finalize();
  const url = URL.createObjectURL(new Blob([target.buffer], { type: 'video/mp4' }));
  const file = `${(document.title || 'render').replace(/\W+/g, '-')}${label === 'Video' ? '' : '-' + label.replace(/\W+/g, '-')}.mp4`;
  const a = Object.assign(document.createElement('a'), { href: url, download: file });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);   // free memory before next part
}

$('mf-go').onclick = async () => {
  const mf = window.__mf; if (!mf) return msg('Scene not ready yet.');
  if ($('mf-q').value === '') return msg('Pick Good, High or Epic first.');
  if (!('VideoEncoder' in window)) return msg('This browser lacks WebCodecs — use Chrome, Edge or Safari 17+.');
  const p = presets[$('mf-q').value], [w, h] = dims(p);
  const br = Math.min(Math.round(w * h * p.fps * 0.15), 35e6);
  encoderPick = await pickEncoder(w, h, p.fps, br);
  if (!encoderPick) return msg('No supported video encoder for this size — try a lower quality.');
  const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm');

  const sel = chapters ? $('mf-ch').value : null;
  const jobs = !chapters ? [{ start: 0, end: mf.duration, label: 'Video' }]
    : sel === 'all' ? chapters.map((c, i) => ({ start: c.start, end: c.end, label: `Part ${i + 1}` }))
    : [{ start: chapters[sel].start, end: chapters[sel].end, label: `Part ${+sel + 1}` }];

  window.__mfManual = true; $('mf-go').disabled = true; $('mf-panel').style.opacity = .35;
  const canvas = mf.canvas || document.querySelector('canvas');
  mf.setSize ? mf.setSize(w, h) : (canvas.width = w, canvas.height = h);
  const t0 = performance.now();
  try {
    for (const j of jobs) {
      await renderRange(mf, canvas, j.start, j.end, j.label, p, w, h, Muxer, ArrayBufferTarget);
      if (jobs.length > 1) await new Promise((r) => setTimeout(r, 1500)); // let the download start
    }
    $('mf-bar').firstElementChild.style.width = '100%';
    msg(`Done in ${((performance.now() - t0) / 1000).toFixed(0)}s — ${jobs.length > 1 ? jobs.length + ' MP4 parts' : 'MP4'} downloaded.` +
      (jobs.length > 1 ? ' Join them in CapCut or iMovie in order.' : ''));
  } catch (e) { msg('Render stopped: ' + (e.message || e) + ' — try a lower quality or one part at a time.'); }
  window.__mfManual = false; $('mf-go').disabled = false; $('mf-panel').style.opacity = 1;
  dispatchEvent(new Event('resize'));
};
</script>
