<meta charset="utf-8"><title>Character Builder</title>
<script type="module">
import { exportCharacterGlb, loadHumanPack } from '../vendor/dramatis-builder.mjs';

  packP ??= loadHumanPack(base + 'hm08/hm08.json', fetcher);

window.__builderReady = true;
</script>
